# Railway Configuration
# Last Update: 2026-01-27 22:30:00 UTC - Commit 7e153e2 - GDPR Panel
[build]
builder = "nixpacks"

[build.nixpacksPlan]
phases.setup.nixPkgs = ["nodejs", "git"]
phases.install.cmds = [
  "npm ci --no-cache",
  "echo 'Build started at:' $(date -u)"
]
phases.build.cmds = [
  "rm -rf node_modules/.vite build dist .cache",
  "echo 'Forcing clean build - clearing all caches'",
  "echo '--- Environment Check ---'",
  "[ -n \"$CAMPUS_CONTROLLER_URL\" ] && echo '✓ CAMPUS_CONTROLLER_URL set' || echo '⚠  CAMPUS_CONTROLLER_URL not set (will use hardcoded default)'",
  "[ -n \"$ALLOWED_ORIGINS\" ] && echo '✓ ALLOWED_ORIGINS set' || echo '⚠  ALLOWED_ORIGINS not set (CORS will allow all origins in production)'",
  "[ -n \"$VITE_SUPABASE_URL\" ] && echo '✓ VITE_SUPABASE_URL set' || echo '⚠  VITE_SUPABASE_URL not set (Network Rewind / Supabase features will be disabled)'",
  "[ -n \"$VITE_SUPABASE_ANON_KEY\" ] && echo '✓ VITE_SUPABASE_ANON_KEY set' || echo '⚠  VITE_SUPABASE_ANON_KEY not set (Network Rewind / Supabase features will be disabled)'",
  "echo '-------------------------'",
  "npm run build",
  "echo 'Version generated by build script:'",
  "node -e \"const v=require('./build/version.json'); console.log('  version:', v.version, '| commit:', v.commit || v.buildTime)\"",
  "ls -la build/ | head -20",
  "echo 'Build completed at:' $(date -u)"
]

[deploy]
# Migrations are NOT chained into the start command.
#
# They were, briefly, and it took the service down: the deployed image does not
# contain `migrations/`, so `migrate.js` exited non-zero and the server never
# started — a crash loop on every boot. Coupling the web server's liveness to a
# migration step means any migration problem becomes a full outage, which is a
# bad trade for a step that needs to run once per schema change.
#
# Run migrations as a separate, explicit step instead:
#   railway run --service <svc> npm run migrate
# or from a one-off/release service. `migrate.js` is advisory-locked and
# idempotent, so running it repeatedly or concurrently is safe.
startCommand = "node server.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

# ---------------------------------------------------------------------------
# Additional Railway services from this same repository. Railway configures
# these in its UI, not from this file — the commands are recorded here so the
# deployment is reproducible from the repo. See docs/MONITORING_PERSISTENCE.md.
#
#   Collector worker service
#     Start command: npm run collector
#     Variables:     DATABASE_URL, CAMPUS_CONTROLLER_URL,
#                    MONITORING_CONTROLLER_USERNAME / _PASSWORD
#                    (or CAMPUS_CONTROLLER_USER / _PASSWORD)
#
#   Retention cleanup service (scheduled)
#     Start command: npm run monitoring:cleanup
#     Cron schedule: 17 * * * *      # hourly at :17; avoids midnight pile-ups
#     Variables:     DATABASE_URL, MONITORING_RETENTION_DAYS
# ---------------------------------------------------------------------------
